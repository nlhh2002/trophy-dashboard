name: Update Clash of Clans trophies

on:
  schedule:
    # 11:55 and 23:55 Asia/Ho_Chi_Minh (UTC+7) = 04:55 and 16:55 UTC.
    # GitHub Actions scheduled runs can be delayed; these are target start times.
    - cron: "55 4,16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trophy-dashboard-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch player data and update JSON
        env:
          COC_API_TOKEN: ${{ secrets.COC_API_TOKEN }}
        run: node scripts/update.js

      - name: Commit updated public snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/players.json
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
          else
            git commit -m "Update player trophy snapshot"
            git push
          fi
